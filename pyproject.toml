[project]
name = "gtd"
version = "0.1.0"
description = "Self-hosted Getting Things Done system — capture, clarify, organize, engage"
readme = "README.md"
authors = [
    { name = "Curtis O'Neal", email = "curtis.oneal@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
gtd = "gtd.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
